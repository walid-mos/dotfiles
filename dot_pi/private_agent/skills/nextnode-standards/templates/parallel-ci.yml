# NextNode common PR CI skeleton.
#
# Copy into .github/workflows/ci.yml and replace the gate jobs below with the
# repository's discovered scripts (read package.json and AGENTS.md first).
# Keep as-is: workflow name CI, permissions, concurrency group, and the final
# aggregator job named `CI` — it is the only check branch protection requires.

name: CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    # --- gate jobs: one job per gate, all running in parallel -----------------
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint

    type-check:
        name: Type-check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm type-check

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build

    # --- required aggregator: the only check branch protection should need ----
    ci:
        name: CI
        needs: [lint, type-check, build]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Fail when any gate failed, was cancelled or skipped
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
              run: exit 1
            - name: All gates green
              run: echo 'All CI gates passed'
