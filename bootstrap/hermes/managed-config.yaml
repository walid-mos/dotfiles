# Managed scope layer — installed at /etc/hermes/config.yaml by hermes/bootstrap.sh.
# Wins over EVERY Hermes home on this machine (root profile + all bots) for exactly
# the keys pinned here. Leaf-level merge: pinning model.default does not freeze
# model.* siblings. Nothing pinned here = zero effect.
#
# This is the official mechanism for "one global config for all agents":
#   https://hermes-agent.nousresearch.com/docs/user-guide/managed-scope
#
# Example — pin something for all bots (uncomment):
# security:
#   redact_secrets: true
# terminal:
#   timeout: 180
