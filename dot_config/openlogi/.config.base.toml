        dpi_gestures = true
        easy_switch = true
        fn_lock = false
        force_sensing = true
        haptic_feedback = true
        haptic_panel = true
        hires_wheel = true
        lighting = false
        onboard_profiles = false
        os_layout = false
        pointer = true
        pointer_scaling = false
        report_rate = false
        scroll_inversion = true
        sidetone = false
        thumbwheel = true
        virtual_thumbwheel = false
      [devices."serial:2639za263bw8".identity.model_info]
        entity_count = 4
        extended_model_id = 7
        model_ids = [45122, 0, 0]
