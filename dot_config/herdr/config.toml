onboarding = false

[session]
# Restore terminal topology first; wt open resumes the selected Pi/environment.
resume_agents_on_restore = false

[keys]
prefix = "ctrl+space"

# Tabs
new_tab = "prefix+n"
next_tab = "ctrl+]"
previous_tab = "ctrl+["

# Workspaces (new_workspace = default prefix+shift+n)
next_workspace = "ctrl+shift+]"
previous_workspace = "ctrl+shift+["

# Panes
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
close_tab = "prefix+x"
close_pane = "alt+x"
split_vertical = "alt+n"
split_horizontal = "alt+v"

# Desktop notifications when a background pi agent finishes (idle) or needs input (blocked).
# "system" = macOS Notification Center via terminal-notifier (no osascript fallback,
# terminal-notifier is installed). Click the notification, then prefix+o focuses the
# pane that raised it.
[ui.toast]
delivery = "system"
delay_seconds = 1

[theme]
# Follow host terminal light/dark appearance, like Ghostty and Neovim
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# === Graphics ===
# herdr 0.8.x: kitty graphics payloads in panes are opt-in (enabled by default in 0.9+).
# Required for pi image previews + chat images (pi detects ghostty and streams kitty).
[experimental]
kitty_graphics = true
