onboarding = false

[session]
# Resume each eligible agent pane with its saved native session.
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"

# Tabs
new_tab = "prefix+n"
next_tab = "ctrl+]"
previous_tab = "ctrl+["

# Workspaces (new_workspace = default prefix+shift+n)
next_workspace = "ctrl+shift+]"
previous_workspace = "ctrl+shift+["

# Panes
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
close_tab = "prefix+x"
close_pane = "alt+x"
split_vertical = "alt+n"
split_horizontal = "alt+v"

[theme]
# Follow host terminal light/dark appearance, like Ghostty and Neovim
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

# Read-only client identity probe for herdr-focus-pane drag assistance.
[[keys.command]]
key = "ctrl+alt+shift+f18"
type = "plugin_action"
command = "ghostty-focus.probe-studio"

# === Graphics ===
# herdr 0.8.x: kitty graphics payloads in panes are opt-in (enabled by default in 0.9+).
# Required for pi image previews + chat images (pi detects ghostty and streams kitty).
[experimental]
kitty_graphics = true
